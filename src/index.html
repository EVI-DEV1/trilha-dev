  <script>
    // Guarda o convite de instalação (PWA) mesmo antes de o Angular carregar.
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__trilhaInstalar = e; });

<body>
  <script>(function(){var t;try{t=localStorage.getItem("trilha-dev:tema")}catch(e){}if(t!=="claro"&&t!=="escuro")t=matchMedia("(prefers-color-scheme: light)").matches?"claro":"escuro";document.documentElement.dataset.tema=t})()</script>
